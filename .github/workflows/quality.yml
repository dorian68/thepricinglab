name: Public source and offline contracts

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Matching backend commit, tag or branch; overrides repository variable TPL_BACKEND_REF
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: WEBSITE/thepricinglab
    env:
      PYTHONUTF8: '1'
      TPL_LLM_PROVIDER: template
    steps:
      - name: Check out frontend at the documented workspace path
        uses: actions/checkout@v4
        with:
          path: WEBSITE/thepricinglab
          persist-credentials: false
      - name: Check out the matching public backend
        uses: actions/checkout@v4
        with:
          repository: dorian68/thepricinglibrary-rag-practice-engine
          ref: ${{ inputs.backend_ref || vars.TPL_BACKEND_REF || 'codex/2026-11-14-interview-lab' }}
          path: Tools/pricinglibrary_rag_backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WEBSITE/thepricinglab/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the locked frontend and slim offline Python dependencies
        run: |
          npm ci
          python -m pip install fastapi==0.115.6 uvicorn==0.34.0 pydantic==2.13.4 numpy==2.4.6 pandas==2.2.3 requests==2.32.5 scikit-learn==1.8.0 "PyJWT[crypto]==2.13.0" pytest==8.4.2 httpx==0.28.1
      - name: Restore and verify the versioned numerical contracts
        run: node scripts/smoke_public_checkout.mjs --prepare-fixtures
      - name: Lint, typecheck and audit runtime dependencies
        run: |
          npm run lint
          npm run typecheck
          npm audit --omit=dev --audit-level=high
      - name: Verify independent numerical engines and cross-runtime identity
        run: |
          npm run smoke:black-scholes
          npm run smoke:payoff
          npm run smoke:curve
          npm run smoke:black-scholes:cross-engine
      - name: Verify interview context, offline references and teaching scenarios
        run: |
          npm run smoke:interview-context
          npm run smoke:exercise-fallback
          node scripts/smoke_generator_presets.mjs
          npm run smoke:teaching-scenarios
      - name: Verify learning hardening and executable practice references offline
        run: |
          npm run smoke:product-hardening
          npm run smoke:product-cycle2
      - name: Exercise signed interview API and ownership without a private corpus
        working-directory: Tools/pricinglibrary_rag_backend
        run: python -m pytest -q tests/test_interview_lab.py --basetemp=.pytest_tmp_public_checkout
      - name: Build and verify the actual public artifact
        run: |
          npm run build
          npm run smoke:bundle
          npm run smoke:local-admin:production
          node scripts/smoke_public_checkout.mjs --check-build
      - name: Scan public source credentials without printing matched values
        working-directory: .
        run: python Tools/pricinglibrary_rag_backend/scripts/audit_secrets.py --root .
      - name: State the scope of this gate
        if: always()
        working-directory: .
        run: |
          echo 'Public source/offline validation does not certify private paid courses, corpus licences, real purchases, provider execution or a deployed commercial release.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See WEBSITE/thepricinglab/docs/WORKSPACE_CHECKOUT.md for the additional private/deployed gates.' >> "$GITHUB_STEP_SUMMARY"
