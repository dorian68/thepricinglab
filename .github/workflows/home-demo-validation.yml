name: Validate home demo and responsive layout
on:
  push:
    branches: [fix/home-demo-responsive-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx eslint --no-ignore src/App.tsx src/components/RouteMetadata.tsx src/main.tsx vite.config.ts
      - run: npm run smoke:seo
      - run: npm run test:loading
      - run: npm run build
      - run: npm run smoke:loading -- dist "$RUNNER_TEMP/pricing-home/candidate-loading.json"
      - name: Prepare the exact course/ticker-validated baseline
        run: git worktree add --detach "$RUNNER_TEMP/pricing-baseline" 261e0ee4bc8159e8c749e7be22db508d6231721b
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ runner.temp }}/pricing-baseline
      - run: npm run build
        working-directory: ${{ runner.temp }}/pricing-baseline
      - name: Install ephemeral headless cloud tools
        run: npm install --prefix "$RUNNER_TEMP/pricing-layout-tools" --no-audit --no-fund --ignore-scripts puppeteer-core@25.16.0 chrome-launcher@1.2.2
      - name: Diagnose exact Home element bounds and preserve course checks
        env:
          PRICING_BASELINE_SHA: 261e0ee4bc8159e8c749e7be22db508d6231721b
          PRICING_HOME_DIAGNOSTICS: 'true'
        run: node scripts/audit-mobile-layout.mjs "$RUNNER_TEMP/pricing-layout-tools" "$RUNNER_TEMP/pricing-baseline/dist" dist "$RUNNER_TEMP/pricing-home"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-home-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pricing-home
          retention-days: 7
