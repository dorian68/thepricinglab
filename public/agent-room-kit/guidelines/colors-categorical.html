<!-- @dsCard group="Colors" viewport="700x150" name="Categorical — Agent & Tag Hues" subtitle="Amber, purple, blue, cyan for status and product tags" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:16px; background: var(--bg-canvas); }
  .row { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
  .sw { border-radius: var(--radius-md); height:54px; padding:7px; display:flex; flex-direction:column; justify-content:flex-end; color:#0A0E14; }
  .n { font-family: var(--font-mono); font-size:10px; font-weight:700; }
  .h { font-family: var(--font-mono); font-size:9px; opacity:.7; }
  .use { font-family: var(--font-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color: var(--text-muted); margin-top:8px; display:block; }
</style>
</head>
<body>
<div class="row">
  <div><div class="sw" style="background:var(--amber-500)"><span class="n">amber-500</span><span class="h">#E8A838</span></div><span class="use">Hedge · Proposing</span></div>
  <div><div class="sw" style="background:var(--purple-500)"><span class="n">purple-500</span><span class="h">#9B7BF0</span></div><span class="use">Balanced · Modeling</span></div>
  <div><div class="sw" style="background:var(--blue-500)"><span class="n">blue-500</span><span class="h">#4D8DF0</span></div><span class="use">Loading · Data Export</span></div>
  <div><div class="sw" style="background:var(--cyan-500)"><span class="n">cyan-500</span><span class="h">#2BC7D4</span></div><span class="use">Confidence</span></div>
</div>
</body>
</html>
